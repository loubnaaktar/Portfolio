<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loubna Aktar — Développeuse Full Stack Java | Spring Boot | React</title>
    <meta
      name="description"
      content="Portfolio de Loubna Aktar, développeuse Full Stack Java / Spring Boot / React. API REST sécurisées, interfaces modernes, Docker, MySQL. Découvrez mes projets et mon parcours."
    />
    <meta name="author" content="Loubna Aktar" />
    <meta name="theme-color" content="#0B1120" />
    <meta name="color-scheme" content="dark light" />
    <script>
      (function () {
        try {
          var storedLang = localStorage.getItem("lang");
          var lang = storedLang === "fr" || storedLang === "en" ? storedLang : "fr";
          document.documentElement.setAttribute("lang", lang);
        } catch (e) {}
        try {
          var stored = localStorage.getItem("theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          var root = document.documentElement;
          root.setAttribute("data-theme", theme);
          root.classList.add(theme);
          root.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "light" ? "#F2F5FB" : "#0B1120");
        } catch (e) {}
      })();
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Loubna Aktar — Développeuse Full Stack Java | React" />
    <meta
      property="og:description"
      content="Développeuse Full Stack passionnée : Java Spring Boot côté back, React côté front. Des applications modernes, performantes et sécurisées."
    />
    <meta property="og:locale" content="fr_FR" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B1120'/%3E%3Cpath d='M18 44V20h6v18h12v6H18z' fill='%233B82F6'/%3E%3Cpath d='M40 20l8 12-8 12-4-3 6-9-6-9 4-3z' fill='%2306B6D4'/%3E%3C/svg%3E"
    />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
